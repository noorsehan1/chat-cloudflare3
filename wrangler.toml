name = "chat-cloudflare3"
main = "index.js"
compatibility_date = "2024-12-12"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "chat"
database_id = "a00662d4-6d99-46ce-a717-4d859b98c132"

# Durable Objects
[durable_objects]
bindings = [
  { name = "CHAT_SERVER", class_name = "ChatServer" },
  { name = "GAME_SERVER", class_name = "GameServer" }
]

# Migrations
[[migrations]]
tag = "v1"
new_classes = ["ChatServer", "GameServer"]
